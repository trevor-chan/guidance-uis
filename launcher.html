<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Launcher</title>
  <style>
    :root {
      --bg: #111;
      --surface: #1e1e1e;
      --text: #ddd;
      --dim: #666;
      --success: #4ade80;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 28px;
    }
    h1 {
      font-size: 1rem;
      letter-spacing: 0.15em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── Screen A: Set Box ─────────────────────────────────────────── */
    #screen-a { display: flex; flex-direction: column; align-items: center; gap: 20px; }
    #ref-image {
      max-width: min(480px, 92vw);
      border-radius: 8px;
      background: #2a2a2a;
      display: block;
    }
    #screen-a h2 {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      color: var(--text);
      text-align: center;
      max-width: 440px;
      line-height: 1.6;
    }
    #btn-set-box {
      padding: 13px 40px;
      border: 2px solid var(--success);
      border-radius: 7px;
      background: #14291a;
      color: var(--success);
      font: bold 0.95rem "Courier New", monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms;
    }
    #btn-set-box:hover:not(:disabled) { background: #1c3a22; }
    #btn-set-box:disabled { opacity: 0.4; cursor: default; }
    #set-box-status { font-size: 0.75rem; color: var(--dim); letter-spacing: 0.05em; }
    #set-box-status.error { color: #f87171; }

    /* ── Screen B: Mode Picker ─────────────────────────────────────── */
    #screen-b { display: none; flex-direction: column; align-items: center; gap: 24px; width: 100%; }
    #screen-b h2 {
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .mode-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(560px, 100%);
    }
    .mode-row {
      display: flex;
      gap: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 14px 8px;
      border: 1px solid #444;
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font: 0.82rem "Courier New", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
      display: block;
    }
    .mode-btn:hover { background: #2a2a2a; border-color: var(--accent); color: var(--accent); }
    .mode-btn.wide { flex: none; width: 100%; font-size: 1rem; letter-spacing: 0.12em; }
    .row-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: uppercase;
      align-self: center;
      min-width: 28px;
    }
  </style>
</head>
<body>
  <h1>Study Session</h1>

  <!-- Screen A: orient probe and press Set Box -->
  <div id="screen-a">
    <img src="assets/setbox_reference.png" id="ref-image"
         alt="Orient probe as shown — crystal face toward patient, cable facing away">
    <h2>Orient Probe as Shown and Press Set Box</h2>
    <button id="btn-set-box">Set Box</button>
    <div id="set-box-status">Ready</div>
  </div>

  <!-- Screen B: select study mode (revealed after set_box ack) -->
  <div id="screen-b">
    <h2>Select Mode</h2>
    <div class="mode-grid">
      <!-- 1D -->
      <div class="mode-row">
        <a href="index.html?study=1&frame=none" class="mode-btn wide">1D</a>
      </div>
      <!-- 2D row -->
      <div class="mode-row">
        <span class="row-label">2D</span>
        <a href="index-2d.html?study=1&frame=user"       class="mode-btn">User</a>
        <a href="index-2d.html?study=1&frame=patient"    class="mode-btn">Patient</a>
        <a href="index-2d.html?study=1&frame=transducer" class="mode-btn">Transducer</a>
      </div>
      <!-- 3D row -->
      <div class="mode-row">
        <span class="row-label">3D</span>
        <a href="index-3d.html?study=1&frame=user"       class="mode-btn">User</a>
        <a href="index-3d.html?study=1&frame=patient"    class="mode-btn">Patient</a>
        <a href="index-3d.html?study=1&frame=transducer" class="mode-btn">Transducer</a>
      </div>
    </div>
  </div>

  <script>
    const WS_URL    = "ws://localhost:8765";
    const btnSetBox = document.getElementById("btn-set-box");
    const statusEl  = document.getElementById("set-box-status");

    btnSetBox.addEventListener("click", () => {
      btnSetBox.disabled = true;
      statusEl.textContent = "Connecting to server…";
      statusEl.className = "";

      const socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        statusEl.textContent = "Connected — capturing box origin…";
        socket.send(JSON.stringify({ cmd: "set_box" }));
      };

      socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.cmd_ack === "set_box") {
          socket.close();
          document.getElementById("screen-a").style.display = "none";
          document.getElementById("screen-b").style.display = "flex";
        } else if (data.error) {
          statusEl.textContent = "Error: " + data.error.replaceAll("_", " ");
          statusEl.className = "error";
          btnSetBox.disabled = false;
          socket.close();
        }
      };

      socket.onerror = () => {
        statusEl.textContent = "Connection failed — is the server running?";
        statusEl.className = "error";
        btnSetBox.disabled = false;
      };

      socket.onclose = () => {};
    });
  </script>
</body>
</html>
